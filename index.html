<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Für meine wundervolle Frau Rahila | 1. Jahrestag</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose: {
              50: '#fff8f8',
              100: '#fceef0',
              200: '#f8dce0',
              300: '#f1bec6',
              400: '#e595a3',
              500: '#d66d81',
              600: '#be4d64',
              700: '#9f3b50',
              800: '#853345',
              900: '#712e3e',
            },
            gold: {
              100: '#fbf5e6',
              200: '#f5e6c0',
              300: '#ebd294',
              400: '#deb865',
              500: '#d4af37',
              600: '#b58e26',
            },
            cream: {
              50: '#FFFCF9',
              100: '#FDF7F0',
              200: '#F9EDE0',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            editorial: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            script: ['"Great Vibes"', 'cursive'],
            sans: ['"Montserrat"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #fff8f8 0%, #FDF7F0 45%, #fceef0 100%);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Glassmorphism & Card Styling */
    .romantic-card {
      background: rgba(255, 252, 249, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.28);
      box-shadow: 
        0 20px 50px -12px rgba(159, 59, 80, 0.14),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    }

    /* Shimmering Gold Text */
    @keyframes goldShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .gold-text {
      background: linear-gradient(135deg, #b58e26 0%, #d4af37 35%, #be4d64 70%, #b58e26 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldShimmer 6s ease infinite;
    }

    /* Floating Animation for Envelope & Icons */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-float {
      animation: gentleFloat 3.5s ease-in-out infinite;
    }

    /* Heartbeat Pulse */
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.15); }
      28% { transform: scale(1); }
      42% { transform: scale(1.15); }
      70% { transform: scale(1); }
    }
    .animate-heartbeat {
      animation: heartBeat 2.2s infinite;
    }

    /* Page Transition Animations */
    .page-enter {
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .page-enter-active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .page-exit {
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      transition: opacity 0.3s ease-in, transform 0.3s ease-in;
    }

    /* Custom Scrollbar for inner content if needed on very small screens */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #e595a3;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="text-rose-900 font-sans antialiased selection:bg-rose-200 selection:text-rose-900 relative flex flex-col justify-between min-h-screen">

  <!-- Background Canvas for Floating Hearts & Golden Sparkles -->
  <canvas id="bg-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Soft Ambient Glow Circles -->
  <div class="fixed top-[-10%] left-[-10%] w-96 h-96 rounded-full bg-rose-300/25 blur-[100px] pointer-events-none z-0"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-96 h-96 rounded-full bg-gold-300/25 blur-[110px] pointer-events-none z-0"></div>

  <!-- Top Navigation Bar (Hidden until surprise is opened) -->
  <header id="top-bar" class="relative z-20 w-full max-w-4xl mx-auto px-4 pt-4 pb-2 flex items-center justify-between opacity-0 pointer-events-none transition-opacity duration-700">
    <div class="flex items-center gap-2">
      <span class="font-script text-2xl sm:text-3xl text-rose-700">Johannes &amp; Rahila</span>
    </div>

    <!-- Ambient Music Button -->
    <button id="music-btn" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/80 hover:bg-white border border-gold-400/40 shadow-sm text-xs font-medium text-rose-800 transition-all duration-300 active:scale-95">
      <i data-lucide="music" id="music-icon" class="w-3.5 h-3.5 text-rose-600"></i>
      <span id="music-label">Melodie abspielen</span>
      <span id="music-indicator" class="hidden flex items-end gap-0.5 h-2.5 ml-0.5">
        <span class="w-0.5 h-full bg-rose-500 animate-pulse"></span>
        <span class="w-0.5 h-1.5 bg-gold-500 animate-pulse" style="animation-delay: 0.15s"></span>
        <span class="w-0.5 h-2 bg-rose-500 animate-pulse" style="animation-delay: 0.3s"></span>
      </span>
    </button>
  </header>

  <!-- =========================================================
       INTRO OVERLAY: ENVELOPE / GIFT SURPRISE SCREEN
       ========================================================= -->
  <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-6 w-full max-w-3xl mx-auto">
    
    <div id="envelope-screen" class="w-full max-w-lg mx-auto text-center transition-all duration-700">
      <div class="romantic-card rounded-3xl p-8 sm:p-12 relative overflow-hidden">
        <!-- Decorative Corner Flourishes -->
        <div class="w-24 h-24 rounded-full bg-rose-200/40 blur-2xl absolute -top-8 -left-8 pointer-events-none"></div>
        <div class="w-24 h-24 rounded-full bg-gold-200/50 blur-2xl absolute -bottom-8 -right-8 pointer-events-none"></div>

        <p class="text-xs uppercase tracking-[0.25em] text-gold-600 font-semibold mb-3">
          Eine Überraschung zum 1. Jahrestag
        </p>

        <h1 class="font-script text-4xl sm:text-5xl text-rose-800 mb-6">
          Für meine wundervolle Frau Rahila
        </h1>

        <!-- Interactive Envelope / Gift Button -->
        <div class="my-8 flex justify-center">
          <button id="open-surprise-btn" class="group relative flex flex-col items-center justify-center focus:outline-none">
            <!-- Outer Glow Ring -->
            <div class="absolute -inset-4 rounded-full bg-gradient-to-r from-rose-300/40 via-gold-300/40 to-rose-300/40 blur-lg group-hover:opacity-100 opacity-75 transition duration-500"></div>
            
            <!-- Envelope Visual -->
            <div class="relative w-36 h-28 sm:w-44 sm:h-32 bg-gradient-to-b from-cream-50 to-rose-100 rounded-2xl border-2 border-gold-400/60 shadow-xl flex items-center justify-center animate-float group-hover:scale-105 transition-transform duration-300">
              <!-- Envelope Flap Lines -->
              <svg class="absolute inset-0 w-full h-full text-gold-400/40" viewBox="0 0 160 110" fill="none">
                <path d="M4 4 L80 62 L156 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M4 106 L55 52" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                <path d="M156 106 L105 52" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
              </svg>

              <!-- Wax Seal Heart -->
              <div class="relative z-10 w-14 h-14 rounded-full bg-gradient-to-br from-rose-500 to-rose-700 shadow-lg border-2 border-gold-300 flex items-center justify-center animate-heartbeat">
                <i data-lucide="heart" class="w-7 h-7 text-white fill-white"></i>
              </div>
            </div>
          </button>
        </div>

        <p class="font-editorial italic text-xl sm:text-2xl text-rose-800/90 mb-6">
          „Ich habe unsere Geschichte in kleine Zeilen gefasst – nur für dich.“
        </p>

        <button id="open-surprise-text-btn" class="inline-flex items-center gap-2 px-7 py-3.5 rounded-full bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-medium text-sm tracking-wide shadow-lg shadow-rose-600/25 transition-all duration-300 transform hover:-translate-y-0.5 active:scale-95">
          <i data-lucide="sparkles" class="w-4 h-4 text-gold-200"></i>
          <span>Klicke hier, um deine Überraschung zu öffnen</span>
        </button>
      </div>
    </div>

    <!-- =========================================================
         STORY BOOK CONTAINER (7 PAGES)
         ========================================================= -->
    <div id="story-container" class="hidden w-full">
      <div class="romantic-card rounded-3xl p-6 sm:p-10 md:p-12 relative overflow-hidden transition-all duration-500">
        
        <!-- Top Subtle Chapter Badge & Icon -->
        <div class="flex flex-col items-center text-center mb-6">
          <div id="page-icon-wrapper" class="w-12 h-12 rounded-full bg-gradient-to-br from-rose-100 to-gold-100 border border-gold-400/50 flex items-center justify-center text-rose-600 shadow-sm mb-3">
            <i id="page-icon" data-lucide="heart" class="w-6 h-6"></i>
          </div>
          <span id="page-subtitle" class="text-[11px] sm:text-xs uppercase tracking-[0.22em] text-gold-600 font-semibold">
            Kapitel 1 von 7
          </span>
        </div>

        <!-- Animated Page Content Area -->
        <div id="page-content" class="page-enter page-enter-active text-center max-w-2xl mx-auto min-h-[290px] sm:min-h-[310px] flex flex-col justify-center">
          <!-- Dynamically populated via JS -->
        </div>

        <!-- Decorative Divider -->
        <div class="flex items-center justify-center gap-3 my-6">
          <div class="h-px w-16 sm:w-24 bg-gradient-to-r from-transparent to-gold-400/60"></div>
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-gold-500"></i>
          <div class="h-px w-16 sm:w-24 bg-gradient-to-l from-transparent to-gold-400/60"></div>
        </div>

        <!-- Navigation Controls (Zurück / Weiter) -->
        <div class="flex items-center justify-between gap-3 pt-1">
          <button id="prev-btn" class="flex items-center gap-1.5 px-4 sm:px-5 py-2.5 rounded-full border border-rose-300/80 text-rose-800 hover:bg-rose-100/60 text-xs sm:text-sm font-medium transition-all duration-200 disabled:opacity-0 disabled:pointer-events-none active:scale-95">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
            <span>Zurück</span>
          </button>

          <!-- Delicate Heart Progress Indicators -->
          <div id="heart-dots" class="flex items-center gap-1.5 sm:gap-2">
            <!-- Populated by JS -->
          </div>

          <button id="next-btn" class="flex items-center gap-1.5 px-5 sm:px-6 py-2.5 rounded-full bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white text-xs sm:text-sm font-medium shadow-md shadow-rose-600/20 transition-all duration-200 active:scale-95">
            <span id="next-btn-text">Weiter</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

      </div>
    </div>

  </main>

  <!-- Subtle Footer -->
  <footer class="relative z-10 text-center py-4 px-4 text-xs text-rose-700/70">
    <p class="font-editorial italic text-sm">In unendlicher Liebe für meine Ehefrau Rahila • Dein Johannes</p>
  </footer>

  <!-- =========================================================
       APPLICATION LOGIC & STORY DATA
       ========================================================= -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    /* ---------------------------------------------------------
       1. DIE 7 KAPITEL EURER LIEBESGESCHICHTE
       --------------------------------------------------------- */
    const storyPages = [
      {
        subtitle: "1. Jahrestag • Johannes & Rahila",
        title: "Alles Liebe zum 1. Jahrestag, mein Schatz!",
        icon: "heart",
        badge: "365 Tage Wir",
        paragraphs: [
          "Heute vor genau einem Jahr hat unsere gemeinsame Geschichte begonnen. Ein einziges Jahr, das mein ganzes Leben für immer verändert und mit einem Licht erfüllt hat, das ich vorher nicht kannte.",
          "Als wir vor einem Jahr zusammengekommen sind, wusste ich tief in meinem Herzen schon, dass du nicht nur ein Kapitel bist – sondern mein ganzes Buch. Aus einem wundervollen Anfang ist unser „Für immer“ geworden."
        ],
        quote: "„Du bist das schönste Geschenk, das mir der Himmel je gemacht hat, meine geliebte Rahila.“"
      },
      {
        subtitle: "Kapitel 2 • Vor einem Jahr",
        title: "Wie alles begann...",
        icon: "sparkles",
        badge: "Unser Ursprung",
        paragraphs: [
          "Ich erinnere mich noch so genau an die ersten Momente, als unsere Herzen zueinander fanden. Selbst als uns noch weite Kilometer voneinander trennten, spürten wir vom allerersten Augenblick an: Wir gehören zusammen.",
          "Jede Nachricht am Morgen, jedes stundenlange Gespräch in der Nacht, jedes Lächeln über den Bildschirm und jede Reise zu dir hat das Band zwischen uns nur noch stärker und unzerreißbarer gemacht."
        ],
        quote: "„Keine Entfernung der Welt war jemals groß genug, um zwei Seelen aufzuhalten, die füreinander bestimmt sind.“"
      },
      {
        subtitle: "Kapitel 3 • Unser Sommermärchen",
        title: "Unser Ja-Wort im Sommer",
        icon: "gem",
        badge: "Mann & Frau",
        paragraphs: [
          "In diesem Sommer ging mein größter Traum in Erfüllung: Wir haben geheiratet. Unter der warmen Sommersonne wurden aus zwei Lebenswegen endgültig ein gemeinsames Schicksal.",
          "Der Augenblick, in dem ich dir in die Augen schauen durfte und du meine Ehefrau wurdest, war der glücklichste Moment meines bisherigen Lebens. Seit diesem Tag trage ich deinen Namen tief in meiner Seele."
        ],
        quote: "„Mein Herz hat im Sommer nicht nur Ja zu dir gesagt – es hat dir mein ganzes Leben versprochen.“"
      },
      {
        subtitle: "Kapitel 4 • Endlich vereint",
        title: "Endlich zusammen in Deutschland",
        icon: "plane-landing",
        badge: "Keine Abschiede mehr",
        paragraphs: [
          "Das lange Warten, das Zählen der Tage und die schweren Abschiede haben endlich ein Ende. Du bist jetzt hier bei mir in Deutschland – genau dort, wo du hingehörst: an meiner Seite.",
          "Jeden Morgen neben dir aufzuwachen, deine Hand im Alltag zu halten und abends gemeinsam einzuschlafen, fühlt sich noch immer wie ein wahr gewordenes Wunder an. Denn Heimat ist für mich überall dort, wo du bist."
        ],
        quote: "„Endlich kein ‚Bis bald‘ mehr – sondern jeden einzelnen Tag ein ‚Schön, dass du da bist, mein Schatz‘.“"
      },
      {
        subtitle: "Kapitel 5 • Unser eigenes Nest",
        title: "Unser neues Zuhause",
        icon: "home",
        badge: "Nächsten Monat",
        paragraphs: [
          "Und schon klopft das nächste große Abenteuer an unsere Tür: Schon nächsten Monat ziehen wir gemeinsam in unser eigenes Haus ein, das wir für unsere Zukunft gekauft haben.",
          "Wir werden jeden einzelnen Raum mit unserem Lachen, unserer Wärme, unseren Düften und unserer Liebe füllen. Hinter dieser Haustür erschaffen wir uns unsere eigene kleine Welt – sicher, geborgen und voller Glück."
        ],
        quote: "„Ein Haus wird aus Steinen gebaut, aber erst durch deine Liebe wird es zu unserem Zuhause.“"
      },
      {
        subtitle: "Kapitel 6 • Unsere Zukunft",
        title: "Unsere Träume für morgen",
        icon: "baby",
        badge: "Unser größter Wunsch",
        paragraphs: [
          "Jetzt fängt unser richtiges Leben zu zweit erst richtig an. Alles liegt vor uns, und mein Herz schlägt voller Vorfreude auf alles, was das kommende Jahr für uns bereithält.",
          "Mein tiefster und schönster Wunsch ist es, dass unsere Liebe im nächsten Jahr noch weiter wächst – und uns vielleicht ein kleines Wunder geschenkt wird. Ein gemeinsames Kind, das deine wundervollen Augen trägt und unser Glück als kleine Familie vollkommen macht."
        ],
        quote: "„Aus unserer großen Liebe soll eines Tages neues Leben erblühen – unser kleines Wunder von dir und mir.“"
      },
      {
        subtitle: "Kapitel 7 • Mein Liebesbrief an dich",
        title: "Ich liebe dich, Rahila",
        icon: "infinity",
        badge: "Für alle Ewigkeit",
        paragraphs: [
          "Danke für dieses unbeschreibliche erste Jahr, meine Traumfrau. Danke für deinen Mut, deine Geduld, deine Zärtlichkeit und dafür, dass du jeden Tag an meiner Seite gehst.",
          "Egal, was die Jahrzehnte bringen: Ich werde dich immer beschützen, dich auf Händen tragen und dich mit jedem Tag noch ein Stückchen mehr lieben als am Tag zuvor."
        ],
        quote: "„Für immer und ewig dein Ehemann – Dein Johannes ❤️“",
        isFinal: true
      }
    ];

    let currentPage = 0;

    // DOM Elements
    const envelopeScreen = document.getElementById('envelope-screen');
    const storyContainer = document.getElementById('story-container');
    const topBar = document.getElementById('top-bar');
    const pageContent = document.getElementById('page-content');
    const pageSubtitle = document.getElementById('page-subtitle');
    const pageIconWrapper = document.getElementById('page-icon-wrapper');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const nextBtnText = document.getElementById('next-btn-text');
    const heartDotsContainer = document.getElementById('heart-dots');

    /* ---------------------------------------------------------
       2. RENDER PAGE & NAVIGATION
       --------------------------------------------------------- */
    function renderHeartDots() {
      heartDotsContainer.innerHTML = '';
      storyPages.forEach((_, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-label', `Gehe zu Seite ${index + 1}`);
        btn.className = `transition-all duration-300 focus:outline-none p-1 ${
          index === currentPage ? 'scale-125 text-rose-600' : 'text-rose-300 hover:text-rose-400'
        }`;
        btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="${index <= currentPage ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
        btn.addEventListener('click', () => goToPage(index));
        heartDotsContainer.appendChild(btn);
      });
    }

    function updatePageContent(animate = true) {
      const data = storyPages[currentPage];

      if (animate) {
        pageContent.classList.remove('page-enter-active');
        pageContent.classList.add('page-exit');
      }

      setTimeout(() => {
        // Update Top Subtitle & Icon
        pageSubtitle.textContent = data.subtitle;
        pageIconWrapper.innerHTML = `<i data-lucide="${data.icon}" class="w-6 h-6 text-rose-600"></i>`;

        // Build HTML for current page
        let html = `
          <div class="inline-flex items-center justify-center mx-auto px-3.5 py-1 rounded-full bg-rose-100/80 border border-rose-200 text-rose-700 text-[11px] font-medium tracking-wider uppercase mb-3">
            ${data.badge}
          </div>
          <h2 class="font-serif text-2xl sm:text-4xl font-semibold gold-text mb-5 leading-tight">
            ${data.title}
          </h2>
          <div class="space-y-4 font-editorial text-lg sm:text-2xl text-rose-900/90 leading-relaxed font-normal px-1 sm:px-4">
            ${data.paragraphs.map(p => `<p>${p}</p>`).join('')}
          </div>
          <div class="mt-6 pt-4 border-t border-gold-300/40 max-w-lg mx-auto">
            <p class="font-editorial italic text-base sm:text-xl text-rose-700 font-semibold">
              ${data.quote}
            </p>
          </div>
        `;

        // Extra interactive Finale Buttons on Page 7
        if (data.isFinal) {
          html += `
            <div class="mt-7 flex flex-col sm:flex-row items-center justify-center gap-3">
              <button id="love-shower-btn" class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-gradient-to-r from-rose-500 via-rose-600 to-gold-500 text-white font-medium text-sm shadow-lg shadow-rose-500/30 hover:scale-105 active:scale-95 transition-all duration-300">
                <i data-lucide="heart" class="w-4 h-4 fill-white"></i>
                <span>Feuerwerk unserer Liebe zünden</span>
              </button>
              <button id="restart-story-btn" class="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-full bg-white/80 hover:bg-white border border-gold-400/50 text-rose-800 text-xs sm:text-sm font-medium transition-all duration-200">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                <span>Noch einmal von vorne lesen</span>
              </button>
            </div>
          `;
        }

        pageContent.innerHTML = html;
        lucide.createIcons();

        // Bind Finale buttons if on last page
        if (data.isFinal) {
          document.getElementById('love-shower-btn').addEventListener('click', triggerHeartExplosion);
          document.getElementById('restart-story-btn').addEventListener('click', () => goToPage(0));
          // Automatically launch a gentle heart celebration when arriving on final page
          triggerHeartExplosion();
        }

        // Update Prev / Next buttons state
        prevBtn.disabled = currentPage === 0;
        if (currentPage === storyPages.length - 1) {
          nextBtn.classList.add('opacity-0', 'pointer-events-none');
        } else {
          nextBtn.classList.remove('opacity-0', 'pointer-events-none');
          nextBtnText.textContent = currentPage === 0 ? 'Unsere Reise starten' : 'Weiter';
        }

        renderHeartDots();

        if (animate) {
          pageContent.classList.remove('page-exit');
          // Force reflow
          void pageContent.offsetWidth;
          pageContent.classList.add('page-enter-active');
        }
      }, animate ? 260 : 0);
    }

    function goToPage(index) {
      if (index < 0 || index >= storyPages.length || index === currentPage) return;
      currentPage = index;
      updatePageContent(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
    nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

    // Keyboard arrow support
    window.addEventListener('keydown', (e) => {
      if (storyContainer.classList.contains('hidden')) return;
      if (e.key === 'ArrowRight') goToPage(currentPage + 1);
      if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
    });

    /* ---------------------------------------------------------
       3. OPENING THE SURPRISE ENVELOPE
       --------------------------------------------------------- */
    function openSurprise() {
      // Trigger burst of hearts
      triggerHeartExplosion();
      
      // Start soft romantic melody automatically on user interaction
      if (!isPlayingAudio) {
        toggleRomanticAudio();
      }

      envelopeScreen.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
      setTimeout(() => {
        envelopeScreen.classList.add('hidden');
        storyContainer.classList.remove('hidden');
        topBar.classList.remove('opacity-0', 'pointer-events-none');
        updatePageContent(false);
      }, 450);
    }

    document.getElementById('open-surprise-btn').addEventListener('click', openSurprise);
    document.getElementById('open-surprise-text-btn').addEventListener('click', openSurprise);

    /* ---------------------------------------------------------
       4. FLOATING HEARTS & SPARKLES CANVAS + HEART FIREWORKS
       --------------------------------------------------------- */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let ambientParticles = [];
    let burstParticles = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class AmbientParticle {
      constructor() {
        this.reset(true);
      }
      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : height + 30;
        this.size = Math.random() * 4 + 2.5;
        this.speedY = Math.random() * 0.55 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.35;
        this.opacity = Math.random() * 0.45 + 0.15;
        this.isHeart = Math.random() > 0.35;
        this.color = Math.random() > 0.45 ? '#e595a3' : '#d4af37';
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.015;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX + Math.sin(this.angle) * 0.2;
        this.angle += this.spin;
        if (this.y < -30) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;

        if (this.isHeart) {
          drawHeartPath(ctx, this.size);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    class BurstHeart {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 5.5 + 1.8;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity - 2.2;
        this.gravity = 0.06;
        this.size = Math.random() * 7 + 4;
        this.opacity = 1;
        this.decay = Math.random() * 0.012 + 0.008;
        this.rotation = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.06;
        const palette = ['#be4d64', '#d66d81', '#e595a3', '#d4af37', '#f1bec6'];
        this.color = palette[Math.floor(Math.random() * palette.length)];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.spin;
        this.opacity -= this.decay;
      }
      draw() {
        if (this.opacity <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;
        drawHeartPath(ctx, this.size);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawHeartPath(context, size) {
      context.beginPath();
      const topCurveHeight = size * 0.3;
      context.moveTo(0, topCurveHeight);
      context.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
      context.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, (size + topCurveHeight) / 1.4, 0, size);
      context.bezierCurveTo(0, (size + topCurveHeight) / 1.4, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
      context.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
      context.closePath();
    }

    // Create initial ambient particles
    const count = window.innerWidth < 640 ? 28 : 48;
    for (let i = 0; i < count; i++) {
      ambientParticles.push(new AmbientParticle());
    }

    function triggerHeartExplosion() {
      const centerX = width / 2;
      const centerY = height / 2;
      for (let i = 0; i < 55; i++) {
        burstParticles.push(new BurstHeart(centerX + (Math.random() - 0.5) * 120, centerY + (Math.random() - 0.5) * 80));
      }
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, width, height);
      ambientParticles.forEach(p => {
        p.update();
        p.draw();
      });
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        burstParticles[i].update();
        burstParticles[i].draw();
        if (burstParticles[i].opacity <= 0) {
          burstParticles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    /* ---------------------------------------------------------
       5. GENTLE ROMANTIC PIANO/HARP SYNTHESIZER (Web Audio API)
       --------------------------------------------------------- */
    let audioCtx = null;
    let isPlayingAudio = false;
    let melodyTimer = null;

    // Warm romantic arpeggio notes (F Major / D Minor / Bb Major / C Major)
    const progression = [
      [349.23, 440.00, 523.25, 698.46], // Fmaj
      [293.66, 440.00, 587.33, 698.46], // Dmin
      [233.08, 349.23, 466.16, 587.33], // Bbmaj
      [261.63, 392.00, 523.25, 659.25]  // Cmaj
    ];

    function playNote(freq, delay) {
      if (!audioCtx || !isPlayingAudio) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
      gain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + delay + 0.35);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + 3.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + 4.0);
    }

    function startRomanticLoop() {
      let step = 0;
      const playStep = () => {
        if (!isPlayingAudio) return;
        const chord = progression[step % progression.length];
        chord.forEach((note, idx) => {
          playNote(note, idx * 0.45);
        });
        step++;
      };
      playStep();
      melodyTimer = setInterval(playStep, 3600);
    }

    const musicBtn = document.getElementById('music-btn');
    const musicLabel = document.getElementById('music-label');
    const musicIndicator = document.getElementById('music-indicator');

    function toggleRomanticAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (!isPlayingAudio) {
        isPlayingAudio = true;
        musicLabel.textContent = 'Melodie läuft';
        musicIndicator.classList.remove('hidden');
        startRomanticLoop();
      } else {
        isPlayingAudio = false;
        clearInterval(melodyTimer);
        musicLabel.textContent = 'Melodie abspielen';
        musicIndicator.classList.add('hidden');
      }
    }

    musicBtn.addEventListener('click', toggleRomanticAudio);
  </script>
</body>
</html>
